<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'"
    >
    <meta name="robots" content="noindex">
    <title>Page not found — Latte Team</title>
    <meta name="description" content="The requested page could not be found.">
    <link rel="icon" href="/assets/latte-mark.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/styles.css?v=7">
  </head>
  <body class="error-layout">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Latte Team home">
        <img src="/assets/latte-mark.svg" width="42" height="42" alt="">
        <span>Latte Team</span>
      </a>
      <nav class="language-switcher" aria-label="Language selection">
        <a href="/" lang="en">EN</a>
        <span aria-hidden="true">·</span>
        <a href="/ru/" lang="ru">RU</a>
        <span aria-hidden="true">·</span>
        <a href="/ka/" lang="ka">ქართული</a>
      </nav>
    </header>

    <main class="error-main">
      <section class="error-copy" aria-labelledby="error-title">
        <p class="eyebrow">404</p>
        <h1 id="error-title">Page not found</h1>
        <p class="hero-intro">
          The address may be incorrect or the page may have moved.
          <span lang="ru">Возможно, адрес указан неверно или страница была перемещена.</span>
        </p>
        <div class="error-actions">
          <a class="primary-action" href="/">
            <span>English home</span>
            <span aria-hidden="true">↗</span>
          </a>
          <a class="secondary-action" href="/ru/">На русском</a>
          <a class="secondary-action" href="/ka/" lang="ka">ქართულად</a>
        </div>
      </section>
    </main>

    <footer>
      <span>Latte Team · Tbilisi, Georgia</span>
      <span>© 2026 Latte Team</span>
    </footer>
  </body>
</html>
